name: build-equuleus-poc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize line endings
        run: |
          find . -path ./.git -prune -o -type f \( -name '*.mk' -o -name 'Makefile' -o -name '*.c' -o -name '*.h' -o -name '*.yml' -o -name '*.md' -o -name '.gitattributes' \) -print0 \
            | xargs -0 -r sed -i 's/\r$//'

      - name: Locate preinstalled Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)}"
          echo "NDK=$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          "$NDK/ndk-build" --version || true

      - name: Build arm64 executable
        run: |
          set +e
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk \
            APP_ABI=arm64-v8a \
            NDK_OUT=./obj \
            NDK_LIBS_OUT=./libs \
            -j4 -k > build.log 2>&1
          rc=$?
          cat build.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::ndk-build exited with code $rc"
            grep -i -E 'error:|fatal error:|undefined reference|No such file|not found' build.log \
              | sed 's/%/%25/g' | sort -u | head -60 | while IFS= read -r line; do
                  echo "::error::$line"
                done
            exit "$rc"
          fi
          ls -l libs/arm64-v8a/poc
          file libs/arm64-v8a/poc

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: poc-equuleus-arm64
          path: libs/arm64-v8a/poc
          if-no-files-found: error

      - name: Publish binary into repo
        if: success()
        run: |
          mkdir -p dist
          cp libs/arm64-v8a/poc dist/poc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/poc
          git commit -m "ci: publish arm64 poc binary [skip ci]" || echo "no changes to commit"
          git push origin HEAD:main
